services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-freight_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-freight_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-freight_auction}
    ports:
      - "15439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "16439:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  replay-store:
    image: debian:12-slim
    profiles: ["tools"]
    command: ["bash", "-lc", "mkdir -p /workspace/data/replay && touch /workspace/data/replay/.ready && tail -f /dev/null"]
    volumes:
      - ./data:/workspace/data

volumes:
  postgres_data:
  redis_data:
